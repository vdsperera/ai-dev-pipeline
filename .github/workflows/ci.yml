name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify CLI Version & Help
        run: |
          node bin/cli.js --version
          node bin/cli.js --help

      - name: Check Cross-Tool Configuration Sync
        run: node scripts/sync-tools.js --check

      - name: Run Deterministic Evaluation Benchmarks
        run: node scripts/eval-harness.js --benchmark

      - name: Check Pipeline Status & Health
        run: node bin/cli.js status

      - name: Test End-to-End Scaffolding in Fresh Directory
        shell: bash
        run: |
          mkdir -p test-scaffold-dir
          cd test-scaffold-dir
          node ../bin/cli.js init -y --tools all
          node ../bin/cli.js status
